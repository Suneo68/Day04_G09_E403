# Research Agent Tool Declarations - Production Optimized
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Công cụ hỏi lại người dùng để lấy thêm thông tin hoặc xin xác nhận. BẮT BUỘC dùng trong 3 trường hợp: 1) Thiếu URL bài viết/trang web khi user nhờ đọc/tóm tắt (response_type='text'). 2) Thiếu username/handle khi nhờ lấy tweet (response_type='text'). 3) Xin xác nhận Có/Không TRƯỚC KHI gửi tin nhắn bằng tool send (response_type='yes_no')."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Nội dung câu hỏi làm rõ hoặc xin xác nhận từ người dùng."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu phản hồi cần từ user. Bắt buộc dùng 'yes_no' khi xin xác nhận trước khi gửi tin."}
        options: {type: array, default: [], items: {type: string}, description: "Danh sách tùy chọn nếu response_type là choice."}
      required: [question, response_type]

  - name: timeline
    description: "Lấy dòng thời gian bài đăng (tweets) của MỘT TÀI KHOẢN X/TWITTER CỤ THỂ. Chỉ dùng khi có username/handle chính xác (vd: sama, elonmusk). TUYỆT ĐỐI KHÔNG tự bịa hoặc tự đoán username nếu người dùng không nhắc tên tài khoản cụ thể."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên handle Twitter (vd: sama, elonmusk). KHÔNG bao gồm ký tự @."}
        limit: {type: integer, default: 5, description: "Số lượng tweet cần lấy (mặc định 5)."}
      required: [screenname]

  - name: social_search
    description: "Tìm kiếm các bài đăng, thảo luận hoặc xu hướng trên mạng xã hội Twitter/X theo CHỦ ĐỀ hoặc TỪ KHÓA (vd: 'GPT-5', 'AI news'). Không dùng nếu người dùng yêu cầu 'bỏ Twitter' hoặc chỉ định tìm tài khoản cụ thể."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa hoặc chủ đề cần tìm trên Twitter."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp: 'Latest' cho tin mới nhất, 'Top' cho tin phổ biến/nổi bật nhất."}
        limit: {type: integer, default: 5, description: "Số lượng kết quả cần lấy."}
      required: [query]

  - name: lookup
    description: "Tìm kiếm thông tin tổng hợp hoặc tin tức trên Internet (Web Search). Tuyệt đối KHÔNG dùng tool này cho các bài toán giải tích/tích phân, lập trình, hoặc các câu hỏi không liên quan đến nghiên cứu thông tin."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa cốt lõi cần tìm. Giữ từ khóa sạch, KHÔNG tự thêm các từ rác như 'news', 'tin tức' vào ô query."}
        topic: {type: string, enum: [general, news], default: "general", description: "Chọn 'news' khi người dùng hỏi về tin tức, thời sự hoặc sự kiện gần đây. Ngược lại chọn 'general'."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian tìm kiếm: 'day' cho hôm nay, 'week' cho tuần này, 'month' cho tháng này."}
        max_results: {type: integer, default: 5, description: "Số lượng kết quả tối đa."}
      required: [query]

  - name: fetch
    description: "Truy cập và đọc nội dung chi tiết từ một đường link URL cụ thể trên web. Chỉ gọi khi đã có URL hợp lệ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Đường link URL đầy đủ (ví dụ: https://openai.com/blog/...)."}
      required: [url]

  - name: format
    description: "Định dạng và trình bày danh sách dữ liệu nghiên cứu đã thu thập thành văn bản báo cáo hoặc bản tin chuyên nghiệp."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách các mục thông tin thu thập được từ các tool khác."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Mẫu trình bày mong muốn."}
        headline: {type: string, default: "", description: "Tiêu đề chính của báo cáo."}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi nội dung tin nhắn hoặc báo cáo lên Telegram. BẮT BUỘC phải gọi tool `clarify` (với response_type='yes_no') để xin xác nhận của người dùng TRƯỚC KHI được phép gọi tool này."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung văn bản cần gửi."}
        confirmed: {type: boolean, default: false, description: "Xác nhận của người dùng (true nếu đã được xác nhận)."}
      required: [text]

  - name: policy
    description: "Tra cứu thông tin trong tài liệu hướng dẫn và chính sách quy định nội bộ của tổ chức."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa chính sách cần tìm."}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Lĩnh vực chính sách."}
        top_k: {type: integer, default: 3, description: "Số lượng kết quả."}
      required: [query]

  - name: papers
    description: "Tìm kiếm các bài báo khoa học và công trình nghiên cứu trên cơ sở dữ liệu arXiv."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa khoa học hoặc tên đề tài."}
        max_results: {type: integer, default: 5, description: "Số bài báo tối đa."}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Tiêu chí sắp xếp."}
      required: [query]

  - name: paper_text
    description: "Trích xuất và đọc nội dung văn bản đầy đủ từ một bài báo khoa học arXiv."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "Mã ID arXiv hoặc đường dẫn bài báo."}
        max_pages: {type: integer, default: 5, description: "Số trang cần trích xuất."}
        max_chars: {type: integer, default: 8000, description: "Số ký tự tối đa."}
      required: [arxiv_url]

  # ---------------- Team-added tools ----------------
  - name: summarize
    description: "Tóm tắt đoạn văn bản thô hoặc báo cáo thành các ý gạch đầu dòng (bullet points) ngắn gọn, súc tích. Sử dụng khi có sẵn văn bản đầu vào cần tóm tắt."
    parameters:
      type: object
      properties:
        text: {type: string, description: "Đoạn văn bản đầu vào cần tóm tắt."}
        max_points: {type: integer, default: 5, description: "Số lượng ý gạch đầu dòng tối đa."}
        language: {type: string, enum: [vi, en], default: "vi", description: "Ngôn ngữ của bản tóm tắt đầu ra."}
      required: [text]
