# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "BẮT BUỘC gọi để hỏi người dùng trong 3 trường hợp: 1) Thiếu URL. 2) Thiếu tên tài khoản. 3) Xin xác nhận TRƯỚC KHI gọi công cụ send. TUYỆT ĐỐI KHÔNG dùng tool này để hỏi xác nhận nếu người dùng chỉ yêu cầu tóm tắt/đọc bài (fetch) VÀ đã cung cấp sẵn URL hợp lệ."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "BẮT BUỘC chọn 'yes_no' nếu yêu cầu của người dùng là GỬI, ĐĂNG BÀI (send), để hỏi họ có chắc chắn không. TUYỆT ĐỐI KHÔNG dùng 'text' để hỏi nội dung gửi. Chỉ chọn 'text' nếu cần xin URL hoặc tên tài khoản."}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question, response_type]

  - name: timeline
    description: "Lấy bài đăng của MỘT NGƯỜI/TÀI KHOẢN CỤ THỂ. Nếu người dùng nhắc đến tên (VD: Sam Altman, Elon Musk), tự động map sang handle (sama, elonmusk) và gọi công cụ này ngay. TUYỆT ĐỐI KHÔNG dùng để tìm kiếm theo chủ đề chung (như AI, công nghệ)."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản (handle)"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm kiếm trên Twitter/mạng xã hội. CHỈ GỌI CÔNG CỤ NÀY khi người dùng có nhắc đến 'tweet', 'twitter', 'mạng xã hội', hoặc 'mọi người bàn gì'. TUYỆT ĐỐI KHÔNG GỌI nếu người dùng chỉ hỏi 'tin tức' (news) chung chung trên web. NẾU người dùng yêu cầu 'bỏ Twitter', TUYỆT ĐỐI KHÔNG gọi lại công cụ này ở các lượt sau."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa chủ đề"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tìm kiếm thông tin trên internet. Công cụ này CÓ THỂ được gọi ĐỒNG THỜI cùng với các công cụ khác (như social_search, timeline) nếu người dùng yêu cầu lấy dữ liệu từ nhiều nguồn. TUYỆT ĐỐI KHÔNG sử dụng công cụ này để giải toán, viết code, hoặc trả lời các câu hỏi lập trình."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa cốt lõi. BẮT BUỘC dùng chính xác từ khóa mà không được tự ý thêm các từ như 'tin tức', 'news' vào truy vấn."}
        topic: {type: string, enum: [general, news], default: "general", description: "BẮT BUỘC chọn 'news' nếu người dùng yêu cầu 'tin', 'tin tức' hoặc 'news'. Các trường hợp khác chọn 'general'."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian: 'hôm nay' -> day, 'tuần này' -> week, 'tháng này' -> month."}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi văn bản. BẮT BUỘC GỌI TOOL `clarify` (với response_type: yes_no) ĐỂ XÁC NHẬN TRƯỚC KHI GỌI TOOL NÀY. CHỈ GỌI TOOL NÀY SAU KHI ĐÃ CÓ SỰ XÁC NHẬN CỦA NGƯỜI DÙNG."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
